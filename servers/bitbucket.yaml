id: bitbucket
name: Bitbucket MCP Server
description: >
  MCP server for Atlassian Bitbucket that connects AI tools to repositories, pull requests,
  branches, and pipelines. Enables agents to review and create pull requests, read file
  contents and diffs, leave comments, and inspect build status on Bitbucket Cloud and Server.
author:
  name: Atlassian Community
  github: MatanYemini
repository: https://github.com/MatanYemini/bitbucket-mcp
transport:
  - stdio
category: Development
tags:
  - bitbucket
  - git
  - version-control
  - pull-requests
  - atlassian
  - code-review
created_at: "2026-06-24T00:00:00.000Z"
updated_at: "2026-06-24T00:00:00.000Z"
tools:
  - name: list_pull_requests
    description: List pull requests for a repository with optional state filter.
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          description: Bitbucket workspace ID
        repo_slug:
          type: string
          description: Repository slug
        state:
          type: string
          description: PR state (OPEN, MERGED, DECLINED)
      required:
        - workspace
        - repo_slug
  - name: create_pull_request
    description: Create a pull request between two branches.
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          description: Bitbucket workspace ID
        repo_slug:
          type: string
          description: Repository slug
        source_branch:
          type: string
          description: Source branch
        destination_branch:
          type: string
          description: Destination branch
        title:
          type: string
          description: Pull request title
      required:
        - workspace
        - repo_slug
        - source_branch
        - destination_branch
        - title
  - name: get_file
    description: Read the contents of a file at a given ref.
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          description: Bitbucket workspace ID
        repo_slug:
          type: string
          description: Repository slug
        path:
          type: string
          description: File path
        ref:
          type: string
          description: Branch, tag, or commit
      required:
        - workspace
        - repo_slug
        - path
install:
  npm: "bitbucket-mcp"
  command: npx
  args:
    - "-y"
    - "bitbucket-mcp"
env_vars:
  - name: BITBUCKET_USERNAME
    description: Bitbucket username
    required: true
  - name: BITBUCKET_APP_PASSWORD
    description: Bitbucket app password with repository scopes
    required: true
license: MIT
version: "1.0.0"
stars: 410
