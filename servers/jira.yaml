id: jira
name: Atlassian MCP Server
description: >
  Official Atlassian Rovo MCP Server — a cloud-based bridge between Atlassian Cloud
  and any MCP-compatible AI tool. Enables AI agents to search, summarize, create, and
  update Jira issues, Confluence pages, and Compass components in real-time. Uses OAuth
  2.1 or API token authentication, respects existing user permissions, and supports
  remote HTTP-streaming as well as local stdio via the mcp-remote proxy. Works with
  Claude, GitHub Copilot, Gemini CLI, VS Code, Cursor, and ChatGPT.
author:
  name: Atlassian
  github: atlassian
repository: https://github.com/atlassian/atlassian-mcp-server
transport:
  - http-streaming
  - stdio
category: Productivity
tags:
  - jira
  - confluence
  - atlassian
  - project-management
  - issue-tracking
  - productivity
  - agile
  - devops
created_at: "2025-04-01T00:00:00.000Z"
updated_at: "2026-05-31T00:00:00.000Z"
tools:
  - name: search_issues
    description: >
      Search Jira issues using JQL (Jira Query Language) or natural language.
      Returns issue summaries, statuses, assignees, and priorities.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: JQL query string or natural language description
        maxResults:
          type: integer
          description: Maximum number of issues to return (default 20)
        fields:
          type: array
          items:
            type: string
          description: Specific fields to include in the response
      required:
        - query
  - name: get_issue
    description: >
      Retrieve full details of a Jira issue by its key, including description,
      comments, attachments, and linked issues.
    input_schema:
      type: object
      properties:
        issueKey:
          type: string
          description: Jira issue key (e.g. PROJ-123)
      required:
        - issueKey
  - name: create_issue
    description: >
      Create a new Jira issue with a summary, description, issue type,
      priority, assignee, and labels.
    input_schema:
      type: object
      properties:
        projectKey:
          type: string
          description: Jira project key (e.g. PROJ)
        summary:
          type: string
          description: Issue summary/title
        description:
          type: string
          description: Issue description in Atlassian Document Format or plain text
        issueType:
          type: string
          description: Issue type (e.g. Bug, Story, Task, Epic)
        priority:
          type: string
          description: Priority level (e.g. High, Medium, Low)
        assignee:
          type: string
          description: Assignee account ID or email
      required:
        - projectKey
        - summary
  - name: update_issue
    description: >
      Update fields on an existing Jira issue such as status, assignee,
      priority, or description.
    input_schema:
      type: object
      properties:
        issueKey:
          type: string
          description: Jira issue key
        fields:
          type: object
          description: Fields to update as key-value pairs
      required:
        - issueKey
        - fields
  - name: add_comment
    description: Add a comment to an existing Jira issue.
    input_schema:
      type: object
      properties:
        issueKey:
          type: string
          description: Jira issue key
        body:
          type: string
          description: Comment text
      required:
        - issueKey
        - body
  - name: search_confluence
    description: >
      Search Confluence pages and spaces using CQL (Confluence Query Language)
      or natural language. Returns page titles, spaces, and excerpts.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: CQL query or natural language search
        limit:
          type: integer
          description: Maximum number of results (default 10)
      required:
        - query
  - name: get_confluence_page
    description: >
      Retrieve the full content of a Confluence page by its ID or title.
    input_schema:
      type: object
      properties:
        pageId:
          type: string
          description: Confluence page ID
        title:
          type: string
          description: Page title (alternative to pageId)
  - name: create_confluence_page
    description: >
      Create a new Confluence page in a specified space with a title and body content.
    input_schema:
      type: object
      properties:
        spaceKey:
          type: string
          description: Confluence space key
        title:
          type: string
          description: Page title
        body:
          type: string
          description: Page content in storage format or plain text
        parentId:
          type: string
          description: Optional parent page ID
      required:
        - spaceKey
        - title
        - body
install:
  command: npx
  args:
    - "-y"
    - "mcp-remote"
    - "https://mcp.atlassian.com/v1/mcp"
env_vars:
  - name: ATLASSIAN_API_TOKEN
    description: Atlassian API token for headless/token-based authentication
    required: false
license: Apache-2.0
version: "1.0.0"
stars: 890
