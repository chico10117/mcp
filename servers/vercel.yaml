id: vercel
name: Vercel MCP Server
description: >
  Official Vercel MCP server that gives AI tools secure access to Vercel projects
  via OAuth. Enables searching Vercel documentation, managing projects and deployments,
  analyzing deployment logs, and interacting with Vercel infrastructure. Supports
  Streamable HTTP transport with OAuth authentication and integrates with Claude Code,
  Cursor, VS Code, ChatGPT, Codex CLI, and other AI assistants.
author:
  name: Vercel
  github: vercel
repository: https://github.com/vercel/vercel
transport:
  - http-streaming
category: DevOps
tags:
  - vercel
  - deployment
  - hosting
  - nextjs
  - serverless
  - ci-cd
  - infrastructure
  - cloud
  - frontend
created_at: "2025-05-07T00:00:00.000Z"
updated_at: "2026-05-27T00:00:00.000Z"
tools:
  - name: search_docs
    description: >
      Search Vercel documentation and return relevant pages ranked by relevance.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search query for Vercel documentation
      required:
        - query
  - name: list_projects
    description: >
      List all projects in the authenticated Vercel account or team.
    input_schema:
      type: object
      properties:
        teamId:
          type: string
          description: Optional team ID to filter projects
  - name: get_project
    description: >
      Get detailed information about a specific Vercel project.
    input_schema:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID or name
      required:
        - projectId
  - name: list_deployments
    description: >
      List deployments for a project with status and metadata.
    input_schema:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID or name
        limit:
          type: integer
          description: Number of deployments to return
      required:
        - projectId
  - name: get_deployment
    description: >
      Get detailed information about a specific deployment.
    input_schema:
      type: object
      properties:
        deploymentId:
          type: string
          description: Deployment ID or URL
      required:
        - deploymentId
  - name: get_deployment_logs
    description: >
      Retrieve build and runtime logs for a deployment.
    input_schema:
      type: object
      properties:
        deploymentId:
          type: string
          description: Deployment ID or URL
        type:
          type: string
          description: Log type (build or runtime)
      required:
        - deploymentId
  - name: list_domains
    description: >
      List all domains configured for a project.
    input_schema:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID or name
      required:
        - projectId
  - name: get_environment_variables
    description: >
      List environment variables for a project.
    input_schema:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID or name
      required:
        - projectId
env_vars:
  - name: VERCEL_TOKEN
    description: Vercel authentication token (OAuth handled automatically via remote MCP)
    required: false
license: Apache-2.0
version: "1.0.0"
stars: 13500
