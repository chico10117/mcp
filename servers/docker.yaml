id: docker
name: Docker MCP Server
description: >
  Official Docker MCP server for container management. Enables AI agents to list, start,
  stop, and inspect Docker containers, manage images, view logs, and execute commands
  inside running containers. Supports Docker Compose operations for multi-container
  applications and provides container health monitoring capabilities.
author:
  name: Docker
  github: docker
repository: https://github.com/docker/mcp-gateway
transport:
  - stdio
category: DevOps
tags:
  - docker
  - containers
  - devops
  - deployment
  - infrastructure
created_at: "2025-04-10T00:00:00.000Z"
updated_at: "2026-05-25T00:00:00.000Z"
tools:
  - name: list_containers
    description: List all Docker containers with their status, ports, and resource usage.
    input_schema:
      type: object
      properties:
        all:
          type: boolean
          description: Include stopped containers (default false)
        filters:
          type: object
          description: Filter containers by label, status, or name
  - name: run_container
    description: Create and start a new Docker container from an image.
    input_schema:
      type: object
      properties:
        image:
          type: string
          description: Docker image name and tag
        name:
          type: string
          description: Container name
        ports:
          type: object
          description: Port mappings (host:container)
        env:
          type: object
          description: Environment variables
        volumes:
          type: array
          items:
            type: string
          description: Volume mounts
      required:
        - image
  - name: container_logs
    description: Retrieve logs from a running or stopped container.
    input_schema:
      type: object
      properties:
        container:
          type: string
          description: Container name or ID
        tail:
          type: integer
          description: Number of lines from the end (default 100)
        since:
          type: string
          description: Show logs since timestamp or relative time
      required:
        - container
  - name: exec_command
    description: Execute a command inside a running container.
    input_schema:
      type: object
      properties:
        container:
          type: string
          description: Container name or ID
        command:
          type: array
          items:
            type: string
          description: Command and arguments to execute
      required:
        - container
        - command
install:
  npm: "@docker/mcp-server"
  command: npx
  args:
    - "-y"
    - "@docker/mcp-server"
env_vars: []
license: Apache-2.0
version: "0.3.0"
stars: 1410
