id: trello
name: Trello MCP Server
description: >
  MCP server for Trello that lets AI agents manage boards, lists, and cards. Supports creating
  and moving cards, updating due dates and labels, adding comments and checklists, and
  searching across boards, turning Trello into a conversational task and project tracker.
author:
  name: Trello Community
  github: delorenj
repository: https://github.com/delorenj/mcp-server-trello
transport:
  - stdio
category: Productivity
tags:
  - trello
  - kanban
  - boards
  - tasks
  - project-management
  - productivity
created_at: "2026-06-24T00:00:00.000Z"
updated_at: "2026-06-24T00:00:00.000Z"
tools:
  - name: create_card
    description: Create a card in a Trello list.
    input_schema:
      type: object
      properties:
        list_id:
          type: string
          description: ID of the target list
        name:
          type: string
          description: Card title
        description:
          type: string
          description: Card description
        due:
          type: string
          description: Due date in ISO 8601 format
      required:
        - list_id
        - name
  - name: move_card
    description: Move a card to a different list.
    input_schema:
      type: object
      properties:
        card_id:
          type: string
          description: ID of the card to move
        list_id:
          type: string
          description: Destination list ID
      required:
        - card_id
        - list_id
  - name: list_cards
    description: List cards on a board or within a specific list.
    input_schema:
      type: object
      properties:
        board_id:
          type: string
          description: Board ID
        list_id:
          type: string
          description: Optional list ID to scope results
      required:
        - board_id
install:
  npm: "@delorenj/mcp-server-trello"
  command: npx
  args:
    - "-y"
    - "@delorenj/mcp-server-trello"
env_vars:
  - name: TRELLO_API_KEY
    description: Trello API key
    required: true
  - name: TRELLO_TOKEN
    description: Trello API token
    required: true
license: MIT
version: "1.2.0"
stars: 540
