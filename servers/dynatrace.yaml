id: dynatrace
name: Dynatrace MCP Server
description: >
  Dynatrace's official MCP server that brings the Dynatrace observability platform into AI
  workflows. Lets assistants query problems and vulnerabilities, run DQL against logs,
  metrics, and traces, inspect entities, and pull real-time monitoring data directly into a
  developer's coding environment for faster troubleshooting and root-cause analysis.
author:
  name: Dynatrace
  github: dynatrace-oss
repository: https://github.com/dynatrace-oss/dynatrace-mcp
transport:
  - stdio
category: DevOps
tags:
  - dynatrace
  - observability
  - monitoring
  - dql
  - apm
  - devops
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
tools:
  - name: list_problems
    description: List currently open problems detected by Dynatrace.
    input_schema:
      type: object
      properties: {}
  - name: execute_dql
    description: Execute a Dynatrace Query Language (DQL) statement over logs, metrics, or traces.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: DQL query to run
      required:
        - query
  - name: get_vulnerabilities
    description: Retrieve security vulnerabilities identified by Dynatrace.
    input_schema:
      type: object
      properties: {}
install:
  npm: "@dynatrace-oss/dynatrace-mcp-server"
  command: npx
  args:
    - "-y"
    - "@dynatrace-oss/dynatrace-mcp-server"
env_vars:
  - name: DT_ENVIRONMENT
    description: Dynatrace environment URL (e.g. https://abc12345.apps.dynatrace.com)
    required: true
  - name: DT_PLATFORM_TOKEN
    description: Dynatrace platform token with the required scopes
    required: true
