# MCP Server Definition Template
# Pattern: ^[a-z0-9]+(-[a-z0-9]+)*$ | Max: 128 characters
id: my-server

# [REQUIRED] Human-readable display name.
# Max: 255 characters
name: My MCP Server

# [REQUIRED] Detailed description of what this server does.
# Min: 10 characters | Max: 2000 characters
description: >
  A detailed description of what this MCP server does, what tools it provides,
  and when developers should use it. Be specific about capabilities and use cases.

# [REQUIRED] Author information.
author:
  name: Your Name        # Max: 128 characters
  github: your-github    # GitHub username, max: 64 characters

# [REQUIRED] Source code repository URL.
repository: https://github.com/your-org/your-repo

# [REQUIRED] Supported transport protocols.
# Values: stdio, sse, http-streaming | Min: 1, Max: 3
transport:
  - stdio

# [REQUIRED] Primary category.
# Values: Development, Productivity, Database, DevOps, AI, Research,
#          Browser Automation, Communication, Filesystem, Cloud, Security
category: Development

# [REQUIRED] Kebab-case tags for discovery.
# Min: 1, Max: 20 tags | Each tag max: 64 characters
tags:
  - example-tag
  - another-tag

# [REQUIRED] ISO 8601 datetime when first added to the registry.
created_at: "2025-01-01T00:00:00.000Z"

# [REQUIRED] ISO 8601 datetime when last updated.
updated_at: "2025-01-01T00:00:00.000Z"

# [OPTIONAL] Tools exposed by this server.
# Max: 200 tools
tools:
  - name: example_tool           # Max: 128 characters
    description: >               # Max: 1000 characters
      Description of what this tool does and when to use it.
    input_schema:
      type: object
      properties:
        param_name:
          type: string
          description: Description of this parameter
      required:
        - param_name

# [OPTIONAL] Resources exposed by this server.
# Max: 100 resources
resources:
  - uri_template: "file:///{path}"   # Max: 2048 characters
    description: >                    # Max: 1000 characters
      Description of what this resource provides.

# [OPTIONAL] Prompts exposed by this server.
# Max: 100 prompts
prompts:
  - name: example_prompt         # Max: 128 characters
    description: >               # Max: 1000 characters
      Description of what this prompt does.
    arguments:
      - name: arg_name           # Max: 128 characters
        description: >           # Max: 500 characters
          Description of this argument.

# [OPTIONAL] Installation configuration.
install:
  npm: "@your-org/your-package"
  command: npx
  args:
    - "-y"
    - "@your-org/your-package"

# [OPTIONAL] Environment variables needed by this server.
env_vars:
  - name: API_KEY
    description: API key for authentication
    required: true

# [OPTIONAL] SPDX license identifier.
license: MIT

# [OPTIONAL] Current version of the MCP server.
version: "1.0.0"

# [OPTIONAL] GitHub star count (updated periodically).
stars: 0
