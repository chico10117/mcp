id: browserstack
name: BrowserStack MCP Server
description: >
  BrowserStack's official MCP server for AI-assisted testing. Lets agents manage test cases,
  run manual and automated tests across real browsers and devices, access debugging
  artifacts such as logs and session details, and triage failures using plain English.
  Useful for cross-platform QA and browser-compatibility workflows from MCP-enabled clients.
author:
  name: BrowserStack
  github: browserstack
repository: https://github.com/browserstack/mcp-server
transport:
  - stdio
category: Browser Automation
tags:
  - browserstack
  - testing
  - cross-browser
  - qa
  - automation
  - devices
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
tools:
  - name: run_automated_test
    description: Run an automated test session on BrowserStack across a target browser or device.
    input_schema:
      type: object
      properties:
        browser:
          type: string
          description: Target browser name
        os:
          type: string
          description: Target operating system
        url:
          type: string
          description: URL under test
      required:
        - url
  - name: get_session_details
    description: Retrieve details, logs, and artifacts for a BrowserStack test session.
    input_schema:
      type: object
      properties:
        session_id:
          type: string
          description: ID of the test session
      required:
        - session_id
install:
  npm: "@browserstack/mcp-server"
  command: npx
  args:
    - "-y"
    - "@browserstack/mcp-server"
env_vars:
  - name: BROWSERSTACK_USERNAME
    description: BrowserStack account username
    required: true
  - name: BROWSERSTACK_ACCESS_KEY
    description: BrowserStack access key
    required: true
