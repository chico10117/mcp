id: browserbase
name: Browserbase MCP Server
description: >
  Official Browserbase MCP server for cloud browser automation. Lets AI agents create headless
  browser sessions, navigate pages, extract content, take screenshots, and perform actions using
  Stagehand, enabling reliable web automation and scraping at scale from AI-powered tools.
author:
  name: Browserbase
  github: browserbase
repository: https://github.com/browserbase/mcp-server-browserbase
transport:
  - stdio
category: Browser Automation
tags:
  - browserbase
  - browser-automation
  - web-scraping
  - stagehand
  - headless-browser
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
tools:
  - name: browserbase_navigate
    description: Open a URL in a cloud browser session and wait for it to load.
    input_schema:
      type: object
      properties:
        url:
          type: string
          description: URL to navigate to
      required:
        - url
  - name: browserbase_extract
    description: Extract structured content from the current page using a natural language instruction.
    input_schema:
      type: object
      properties:
        instruction:
          type: string
          description: What to extract from the page
      required:
        - instruction
  - name: browserbase_screenshot
    description: Capture a screenshot of the current page.
    input_schema:
      type: object
      properties:
        full_page:
          type: boolean
          description: Whether to capture the full scrollable page
install:
  npm: "@browserbasehq/mcp-server-browserbase"
  command: npx
  args:
    - "-y"
    - "@browserbasehq/mcp-server-browserbase"
env_vars:
  - name: BROWSERBASE_API_KEY
    description: Browserbase API key
    required: true
  - name: BROWSERBASE_PROJECT_ID
    description: Browserbase project ID
    required: true
license: Apache-2.0
version: "1.2.0"
stars: 1123
