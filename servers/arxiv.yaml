id: arxiv
name: ArXiv MCP Server
description: >
  MCP server for searching and accessing arXiv research papers. Enables AI agents to
  search papers with filters for date ranges and categories, download full paper content,
  read papers in markdown format, and perform semantic search across locally stored
  papers. Supports citation graph exploration via Semantic Scholar and research alert
  watches for tracking new publications on topics of interest.
author:
  name: Joe Blazick
  github: blazickjp
repository: https://github.com/blazickjp/arxiv-mcp-server
transport:
  - stdio
  - http-streaming
category: Research
tags:
  - arxiv
  - papers
  - research
  - academic
  - science
  - literature
  - citations
created_at: "2024-12-01T00:00:00.000Z"
updated_at: "2026-05-20T00:00:00.000Z"
tools:
  - name: search_papers
    description: Search arXiv papers with optional category, date range, and boolean filters.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search query (supports boolean operators AND, OR, quotes for exact match)
        max_results:
          type: integer
          description: Maximum number of results to return (default 10, max 50)
        date_from:
          type: string
          description: Filter papers published after this date (YYYY-MM-DD)
        date_to:
          type: string
          description: Filter papers published before this date (YYYY-MM-DD)
        categories:
          type: array
          items:
            type: string
          description: arXiv category filters (e.g., cs.AI, cs.LG, stat.ML)
        sort_by:
          type: string
          enum: ["relevance", "date"]
          description: Sort results by relevance or date
      required:
        - query
  - name: download_paper
    description: Download a paper by arXiv ID. Tries HTML first, falls back to PDF.
    input_schema:
      type: object
      properties:
        paper_id:
          type: string
          description: arXiv paper ID (e.g., 2401.12345)
        start:
          type: integer
          description: Character offset to start reading from (for pagination)
        max_chars:
          type: integer
          description: Maximum characters to return (for pagination)
      required:
        - paper_id
  - name: read_paper
    description: Read the full text of a locally downloaded paper in markdown format.
    input_schema:
      type: object
      properties:
        paper_id:
          type: string
          description: arXiv paper ID of a previously downloaded paper
        start:
          type: integer
          description: Character offset to start reading from
        max_chars:
          type: integer
          description: Maximum characters to return
      required:
        - paper_id
  - name: list_papers
    description: List all papers that have been downloaded locally.
    input_schema:
      type: object
      properties: {}
install:
  command: uvx
  args:
    - "arxiv-mcp-server"
env_vars: []
license: Apache-2.0
version: "0.5.0"
stars: 2800
