id: postman
name: Postman MCP Server
description: >
  Postman's official MCP server that connects the Postman platform to AI tools. Gives agents
  the ability to access workspaces, manage collections and environments, work with API
  specifications, run requests, and automate API workflows through natural language. Useful
  for exploring, testing, and maintaining APIs directly from an MCP-compatible assistant.
author:
  name: Postman
  github: postmanlabs
repository: https://github.com/postmanlabs/postman-mcp-server
transport:
  - stdio
  - http-streaming
category: Development
tags:
  - postman
  - api
  - api-testing
  - collections
  - developer-tools
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
tools:
  - name: list_collections
    description: List the Postman collections available in the authenticated account or workspace.
    input_schema:
      type: object
      properties:
        workspace:
          type: string
          description: Optional workspace ID to scope the results
  - name: get_collection
    description: Retrieve the contents of a specific Postman collection.
    input_schema:
      type: object
      properties:
        collection_id:
          type: string
          description: ID of the collection to fetch
      required:
        - collection_id
  - name: create_collection
    description: Create a new Postman collection in a workspace.
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Name of the new collection
        workspace:
          type: string
          description: Workspace ID to create the collection in
      required:
        - name
install:
  npm: "@postman/postman-mcp-server"
  command: npx
  args:
    - "-y"
    - "@postman/postman-mcp-server"
env_vars:
  - name: POSTMAN_API_KEY
    description: Postman API key used to authenticate with the Postman platform
    required: true
