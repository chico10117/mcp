id: airtable
name: Airtable MCP Server
description: >
  MCP server for Airtable that lets AI agents read and write records, list bases and tables,
  inspect field schemas, and run filtered queries. Ideal for turning Airtable into a
  lightweight backend or knowledge base that agents can manage conversationally.
author:
  name: Dominik Kundel
  github: domdomegg
repository: https://github.com/domdomegg/airtable-mcp-server
transport:
  - stdio
category: Database
tags:
  - airtable
  - database
  - records
  - no-code
  - tables
  - productivity
created_at: "2026-06-19T00:00:00.000Z"
updated_at: "2026-06-19T00:00:00.000Z"
tools:
  - name: list_records
    description: List records from a table with optional filtering and field selection.
    input_schema:
      type: object
      properties:
        base_id:
          type: string
          description: Airtable base ID
        table:
          type: string
          description: Table name or ID
        filter_by_formula:
          type: string
          description: Airtable formula to filter records
        max_records:
          type: integer
          description: Maximum number of records to return
      required:
        - base_id
        - table
  - name: create_record
    description: Create a new record in a table with the given field values.
    input_schema:
      type: object
      properties:
        base_id:
          type: string
          description: Airtable base ID
        table:
          type: string
          description: Table name or ID
        fields:
          type: object
          description: Field name/value pairs for the new record
      required:
        - base_id
        - table
        - fields
  - name: update_record
    description: Update fields on an existing record.
    input_schema:
      type: object
      properties:
        base_id:
          type: string
          description: Airtable base ID
        table:
          type: string
          description: Table name or ID
        record_id:
          type: string
          description: ID of the record to update
        fields:
          type: object
          description: Field name/value pairs to update
      required:
        - base_id
        - table
        - record_id
        - fields
install:
  npm: "airtable-mcp-server"
  command: npx
  args:
    - "-y"
    - "airtable-mcp-server"
env_vars:
  - name: AIRTABLE_API_KEY
    description: Airtable personal access token
    required: true
license: MIT
version: "1.6.0"
stars: 1340
