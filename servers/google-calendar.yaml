id: google-calendar
name: Google Calendar MCP Server
description: >
  MCP server for Google Calendar that lets AI agents view, create, update, and delete events,
  check availability across calendars, and schedule meetings via the Calendar API with OAuth.
  Useful for natural-language scheduling and calendar management.
author:
  name: nspady
  github: nspady
repository: https://github.com/nspady/google-calendar-mcp
transport:
  - stdio
category: Productivity
tags:
  - google-calendar
  - calendar
  - scheduling
  - events
  - productivity
  - meetings
created_at: "2026-06-24T00:00:00.000Z"
updated_at: "2026-06-24T00:00:00.000Z"
tools:
  - name: list_events
    description: List events within a time range for a calendar.
    input_schema:
      type: object
      properties:
        calendar_id:
          type: string
          description: Calendar ID (defaults to primary)
        time_min:
          type: string
          description: Start of range in ISO 8601 format
        time_max:
          type: string
          description: End of range in ISO 8601 format
      required:
        - time_min
        - time_max
  - name: create_event
    description: Create a calendar event.
    input_schema:
      type: object
      properties:
        summary:
          type: string
          description: Event title
        start:
          type: string
          description: Start time in ISO 8601 format
        end:
          type: string
          description: End time in ISO 8601 format
        attendees:
          type: array
          items:
            type: string
          description: Attendee email addresses
      required:
        - summary
        - start
        - end
  - name: check_availability
    description: Find free/busy windows across one or more calendars.
    input_schema:
      type: object
      properties:
        calendar_ids:
          type: array
          items:
            type: string
          description: Calendars to check
        time_min:
          type: string
          description: Start of range in ISO 8601 format
        time_max:
          type: string
          description: End of range in ISO 8601 format
      required:
        - time_min
        - time_max
install:
  npm: "@cocal/google-calendar-mcp"
  command: npx
  args:
    - "-y"
    - "@cocal/google-calendar-mcp"
env_vars:
  - name: GOOGLE_OAUTH_CREDENTIALS
    description: Path to the Google OAuth client credentials JSON file
    required: true
license: MIT
version: "1.4.0"
stars: 1300
