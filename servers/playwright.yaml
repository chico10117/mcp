id: playwright
name: Playwright MCP Server
description: >
  Microsoft's official Playwright MCP server that provides browser automation capabilities
  for AI agents. Enables navigating web pages, clicking elements, filling forms, taking
  screenshots, and extracting content. Supports headless and headed modes with Chromium,
  Firefox, and WebKit browsers. Ideal for web testing, scraping, and interactive browsing tasks.
author:
  name: Microsoft
  github: microsoft
repository: https://github.com/microsoft/playwright-mcp
transport:
  - stdio
category: Browser Automation
tags:
  - playwright
  - browser
  - automation
  - testing
  - web-scraping
  - screenshots
created_at: "2025-03-01T00:00:00.000Z"
updated_at: "2026-05-25T00:00:00.000Z"
tools:
  - name: browser_navigate
    description: Navigate the browser to a specified URL.
    input_schema:
      type: object
      properties:
        url:
          type: string
          description: URL to navigate to
      required:
        - url
  - name: browser_click
    description: Click an element on the page using a CSS or text selector.
    input_schema:
      type: object
      properties:
        selector:
          type: string
          description: CSS selector or text content to identify the element
      required:
        - selector
  - name: browser_fill
    description: Fill an input field with text.
    input_schema:
      type: object
      properties:
        selector:
          type: string
          description: CSS selector for the input element
        value:
          type: string
          description: Text to fill into the input
      required:
        - selector
        - value
  - name: browser_screenshot
    description: Take a screenshot of the current page or a specific element.
    input_schema:
      type: object
      properties:
        selector:
          type: string
          description: Optional CSS selector to screenshot a specific element
  - name: browser_get_text
    description: Extract text content from the page or a specific element.
    input_schema:
      type: object
      properties:
        selector:
          type: string
          description: Optional CSS selector to extract text from
install:
  npm: "@playwright/mcp"
  command: npx
  args:
    - "-y"
    - "@playwright/mcp"
env_vars: []
license: Apache-2.0
version: "0.1.5"
stars: 12800
