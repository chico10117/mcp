id: context7
name: Context7 MCP Server
description: >
  Provides up-to-date, version-specific documentation and code examples for libraries,
  frameworks, and SDKs directly into your AI prompts. Instead of relying on potentially
  outdated training data, Context7 fetches current documentation from the source. Supports
  thousands of libraries including React, Next.js, Node.js, Python packages, and more.
author:
  name: Upstash
  github: upstash
repository: https://github.com/upstash/context7
transport:
  - stdio
  - http-streaming
category: Development
tags:
  - documentation
  - library-docs
  - api-reference
  - code-examples
  - sdk
created_at: "2025-04-01T00:00:00.000Z"
updated_at: "2026-05-25T00:00:00.000Z"
tools:
  - name: resolve-library-id
    description: Resolve a library name to a Context7 library ID for documentation lookup.
    input_schema:
      type: object
      properties:
        libraryName:
          type: string
          description: Library name to search for (e.g. "react", "nextjs", "express")
      required:
        - libraryName
  - name: get-library-docs
    description: Fetch up-to-date documentation for a library using its Context7 ID.
    input_schema:
      type: object
      properties:
        context7CompatibleLibraryID:
          type: string
          description: The Context7 library ID resolved from resolve-library-id
        topic:
          type: string
          description: Optional topic to focus the documentation on
        tokens:
          type: integer
          description: Maximum number of tokens to return (default 5000)
      required:
        - context7CompatibleLibraryID
install:
  npm: "@upstash/context7-mcp"
  command: npx
  args:
    - "-y"
    - "@upstash/context7-mcp"
env_vars: []
license: Apache-2.0
version: "1.1.1"
stars: 21500
