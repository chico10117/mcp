id: cockroachdb
name: CockroachDB MCP
description: >
  A Model Context Protocol server that provides a natural-language interface for LLMs and agents
  to manage, monitor, and query data in CockroachDB. Supports schema exploration, query plan
  inspection, and running SQL, with a read-only-by-default posture so agents can investigate a
  distributed SQL cluster safely.
author:
  name: Amine El Kouhen
  github: amineelkouhen
repository: https://github.com/amineelkouhen/mcp-cockroachdb
transport:
  - stdio
category: Database
tags:
  - cockroachdb
  - sql
  - distributed-database
  - postgres
  - query
  - schema
created_at: "2026-07-25T00:00:00.000Z"
updated_at: "2026-07-25T00:00:00.000Z"
tools:
  - name: run_query
    description: Execute a SQL query against the connected CockroachDB cluster.
    input_schema:
      type: object
      properties:
        sql:
          type: string
          description: SQL statement to execute
      required:
        - sql
  - name: describe_schema
    description: Return the schema for a table or the whole database.
    input_schema:
      type: object
      properties:
        table:
          type: string
          description: Optional table name to describe
env_vars:
  - name: COCKROACHDB_URL
    description: CockroachDB connection string
    required: true
license: MIT
