id: groq
name: Groq MCP
description: >
  Groq's official MCP server, giving agents access to Groq's high-speed inference stack. Supports
  fast chat and reasoning completions, vision models for interpreting images, text-to-speech and
  speech-to-text, batch processing for high-volume workloads, and lookups against Groq's own
  documentation.
author:
  name: Groq
  github: groq
repository: https://github.com/groq/groq-mcp-server
transport:
  - stdio
category: AI
tags:
  - groq
  - inference
  - low-latency
  - vision
  - speech
  - batch
created_at: "2026-08-03T00:00:00.000Z"
updated_at: "2026-08-03T00:00:00.000Z"
tools:
  - name: chat_completion
    description: Run a chat completion against a Groq-hosted model.
    input_schema:
      type: object
      properties:
        model:
          type: string
          description: Groq model identifier
        prompt:
          type: string
          description: Prompt text
      required:
        - model
        - prompt
  - name: transcribe_audio
    description: Transcribe an audio file to text using a Groq speech model.
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: Path to the audio file
      required:
        - file_path
  - name: text_to_speech
    description: Generate speech audio from text.
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: Text to synthesize
        voice:
          type: string
          description: Voice identifier
      required:
        - text
env_vars:
  - name: GROQ_API_KEY
    description: Groq API key
    required: true
license: MIT
