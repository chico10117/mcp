id: consul
name: HashiCorp Consul MCP
description: >
  HashiCorp's official MCP server for Consul, providing integration with the Consul API for
  service discovery, configuration management, and service mesh operations. Lets AI agents list
  registered services and their health, read and write KV configuration entries, and inspect
  mesh intentions and config entries.
author:
  name: HashiCorp
  github: hashicorp
repository: https://github.com/hashicorp/consul-mcp-server
transport:
  - stdio
  - http-streaming
category: DevOps
tags:
  - consul
  - hashicorp
  - service-discovery
  - service-mesh
  - configuration
  - health-checks
created_at: "2026-07-28T00:00:00.000Z"
updated_at: "2026-07-28T00:00:00.000Z"
tools:
  - name: list_services
    description: List services registered in the Consul catalog with their health status.
    input_schema:
      type: object
      properties:
        datacenter:
          type: string
          description: Optional datacenter to query
  - name: get_kv
    description: Read a value from the Consul KV store.
    input_schema:
      type: object
      properties:
        key:
          type: string
          description: KV path to read
      required:
        - key
  - name: put_kv
    description: Write a value to the Consul KV store.
    input_schema:
      type: object
      properties:
        key:
          type: string
          description: KV path to write
        value:
          type: string
          description: Value to store
      required:
        - key
        - value
env_vars:
  - name: CONSUL_HTTP_ADDR
    description: Address of the Consul HTTP API (e.g. http://127.0.0.1:8500)
    required: true
  - name: CONSUL_HTTP_TOKEN
    description: Consul ACL token
    required: false
license: MPL-2.0
