id: supabase
name: Supabase MCP Server
description: >
  Official Supabase MCP server for database and backend integration. Enables AI agents
  to query PostgreSQL databases, manage tables and schemas, handle authentication users,
  interact with storage buckets, and invoke edge functions. Provides full access to
  Supabase project management including migrations and type generation.
author:
  name: Supabase
  github: supabase
repository: https://github.com/supabase/supabase-mcp
transport:
  - stdio
category: Database
tags:
  - supabase
  - postgres
  - database
  - backend
  - authentication
  - storage
created_at: "2025-03-20T00:00:00.000Z"
updated_at: "2026-05-25T00:00:00.000Z"
tools:
  - name: execute_sql
    description: Execute a SQL query against the Supabase PostgreSQL database.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: SQL query to execute
        params:
          type: array
          description: Query parameters for parameterized queries
      required:
        - query
  - name: list_tables
    description: List all tables in the database with their schemas and row counts.
    input_schema:
      type: object
      properties:
        schema:
          type: string
          description: Schema name (default public)
  - name: get_table_schema
    description: Get the column definitions and constraints for a specific table.
    input_schema:
      type: object
      properties:
        table:
          type: string
          description: Table name
        schema:
          type: string
          description: Schema name (default public)
      required:
        - table
  - name: manage_storage
    description: Upload, download, or list files in Supabase Storage buckets.
    input_schema:
      type: object
      properties:
        action:
          type: string
          description: Action to perform (list, upload, download, delete)
        bucket:
          type: string
          description: Storage bucket name
        path:
          type: string
          description: File path within the bucket
      required:
        - action
        - bucket
install:
  npm: "@supabase/mcp-server"
  command: npx
  args:
    - "-y"
    - "@supabase/mcp-server"
env_vars:
  - name: SUPABASE_URL
    description: Supabase project URL
    required: true
  - name: SUPABASE_SERVICE_ROLE_KEY
    description: Supabase service role key for admin access
    required: true
license: Apache-2.0
version: "0.3.0"
stars: 4100
