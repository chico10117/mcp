id: couchbase
name: Couchbase MCP Server
description: >
  Community-supported MCP server from the Couchbase ecosystem that lets AI assistants
  interact with data in Couchbase clusters and Capella. Exposes tools to browse scopes and
  collections, run SQL++ (N1QL) queries, and read or modify documents, with authentication
  and safety controls enforced by the server. Useful for conversational data exploration and
  operational queries against Couchbase.
author:
  name: Couchbase Ecosystem
  github: Couchbase-Ecosystem
repository: https://github.com/Couchbase-Ecosystem/mcp-server-couchbase
transport:
  - stdio
category: Database
tags:
  - couchbase
  - database
  - nosql
  - n1ql
  - query
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
tools:
  - name: run_sql_plus_plus_query
    description: Execute a SQL++ (N1QL) query against the configured Couchbase bucket.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: SQL++ query to run
      required:
        - query
  - name: get_document_by_id
    description: Retrieve a document from a collection by its key.
    input_schema:
      type: object
      properties:
        scope:
          type: string
          description: Scope name
        collection:
          type: string
          description: Collection name
        document_id:
          type: string
          description: Key of the document to fetch
      required:
        - scope
        - collection
        - document_id
env_vars:
  - name: CB_CONNECTION_STRING
    description: Couchbase cluster connection string (e.g. couchbases://cb.example.com)
    required: true
  - name: CB_USERNAME
    description: Couchbase database user
    required: true
  - name: CB_PASSWORD
    description: Password for the Couchbase user
    required: true
  - name: CB_BUCKET_NAME
    description: Name of the bucket to operate on
    required: true
