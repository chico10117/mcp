id: sentry
name: Sentry MCP Server
description: >
  MCP server for Sentry error tracking integration. Enables AI agents to retrieve and
  analyze issues, view error stack traces, search events by query, and access project
  performance data. Helps developers debug production errors by providing contextual
  error information directly in AI-powered development workflows.
author:
  name: Sentry
  github: getsentry
repository: https://github.com/getsentry/sentry-mcp
transport:
  - stdio
category: DevOps
tags:
  - sentry
  - error-tracking
  - debugging
  - monitoring
  - observability
created_at: "2025-02-01T00:00:00.000Z"
updated_at: "2026-05-25T00:00:00.000Z"
tools:
  - name: list_issues
    description: List recent issues from a Sentry project with status and frequency.
    input_schema:
      type: object
      properties:
        project:
          type: string
          description: Sentry project slug
        query:
          type: string
          description: Search query to filter issues
        status:
          type: string
          description: Filter by status (unresolved, resolved, ignored)
      required:
        - project
  - name: get_issue_details
    description: Get detailed information about a specific Sentry issue including stack trace.
    input_schema:
      type: object
      properties:
        issueId:
          type: string
          description: Sentry issue ID
      required:
        - issueId
  - name: search_events
    description: Search for error events matching a query across projects.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Sentry search query (e.g. error message, tag filters)
        project:
          type: string
          description: Project slug to search within
        timeRange:
          type: string
          description: Time range (e.g. 24h, 7d, 30d)
      required:
        - query
install:
  npm: "@sentry/mcp-server"
  command: npx
  args:
    - "-y"
    - "@sentry/mcp-server"
env_vars:
  - name: SENTRY_AUTH_TOKEN
    description: Sentry authentication token
    required: true
  - name: SENTRY_ORG
    description: Sentry organization slug
    required: true
license: MIT
version: "0.4.0"
stars: 704
