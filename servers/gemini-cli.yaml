id: gemini-cli
name: Gemini CLI MCP Tool
description: >
  An MCP server that lets AI assistants delegate work to the Google Gemini CLI, taking advantage
  of Gemini's very large context window for whole-file and codebase analysis. Exposes tools to
  ask Gemini questions with file references, brainstorm ideas, and stream long responses in
  chunks, so a client model can offload large-context reasoning to Gemini without leaving the
  current session.
author:
  name: jamubc
  github: jamubc
repository: https://github.com/jamubc/gemini-mcp-tool
transport:
  - stdio
category: AI
tags:
  - gemini
  - google
  - code-analysis
  - large-context
  - cli
  - delegation
created_at: "2026-07-21T00:00:00.000Z"
updated_at: "2026-07-21T00:00:00.000Z"
tools:
  - name: ask-gemini
    description: Send a prompt to the Gemini CLI, optionally including file references, and return the response.
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt to send to Gemini, may include @file references
        model:
          type: string
          description: Optional Gemini model to use
      required:
        - prompt
  - name: brainstorm
    description: Ask Gemini to generate and expand ideas around a given topic or problem.
    input_schema:
      type: object
      properties:
        topic:
          type: string
          description: The topic or problem to brainstorm about
      required:
        - topic
  - name: ping
    description: Health check that verifies the Gemini CLI is reachable.
    input_schema:
      type: object
      properties: {}
install:
  npm: "gemini-mcp-tool"
  command: npx
  args:
    - "-y"
    - "gemini-mcp-tool"
env_vars: []
license: MIT
