id: hubspot
name: HubSpot MCP Server
description: >
  Official HubSpot MCP server connecting AI tools to the HubSpot CRM. Enables agents to read
  and manage contacts, companies, deals, and tickets, search the CRM, and create engagements
  such as notes and tasks. Honors HubSpot scopes and rate limits via OAuth.
author:
  name: HubSpot
  github: HubSpot
repository: https://github.com/HubSpot/hubspot-mcp-server
transport:
  - stdio
  - http-streaming
category: Productivity
tags:
  - hubspot
  - crm
  - sales
  - marketing
  - contacts
  - deals
created_at: "2026-06-19T00:00:00.000Z"
updated_at: "2026-06-19T00:00:00.000Z"
tools:
  - name: search_crm
    description: Search CRM objects (contacts, companies, deals, tickets) by query and filters.
    input_schema:
      type: object
      properties:
        object_type:
          type: string
          description: CRM object type (contacts, companies, deals, tickets)
        query:
          type: string
          description: Search text
      required:
        - object_type
        - query
  - name: create_contact
    description: Create a new contact with the given properties.
    input_schema:
      type: object
      properties:
        email:
          type: string
          description: Contact email address
        firstname:
          type: string
          description: First name
        lastname:
          type: string
          description: Last name
        properties:
          type: object
          description: Additional contact properties
      required:
        - email
  - name: update_deal
    description: Update properties or stage on an existing deal.
    input_schema:
      type: object
      properties:
        deal_id:
          type: string
          description: Deal record ID
        stage:
          type: string
          description: Pipeline stage to move the deal to
        amount:
          type: number
          description: Deal amount
      required:
        - deal_id
install:
  npm: "@hubspot/mcp-server"
  command: npx
  args:
    - "-y"
    - "@hubspot/mcp-server"
env_vars:
  - name: HUBSPOT_ACCESS_TOKEN
    description: HubSpot private app access token
    required: true
license: MIT
version: "1.1.0"
stars: 690
