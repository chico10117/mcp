id: e2b
name: E2B MCP Server
description: >
  E2B's MCP server gives AI agents the ability to run arbitrary code in secure, isolated cloud
  sandboxes. Each sandbox is a fast-booting micro-VM where models can execute Python and shell
  commands, install packages, read and write files, and capture stdout/stderr — ideal for code
  interpretation, data analysis, and agentic workflows that need real execution.
author:
  name: E2B
  github: e2b-dev
repository: https://github.com/e2b-dev/mcp-server
transport:
  - stdio
category: Development
tags:
  - code-execution
  - sandbox
  - python
  - code-interpreter
  - data-analysis
  - agents
created_at: "2026-06-12T00:00:00.000Z"
updated_at: "2026-06-12T00:00:00.000Z"
tools:
  - name: run_code
    description: Execute code in a secure E2B sandbox and return stdout, stderr, and any results.
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: The code to execute in the sandbox
        language:
          type: string
          description: Language to run (e.g., python, javascript, bash)
      required:
        - code
install:
  npm: "@e2b/mcp-server"
  command: npx
  args:
    - "-y"
    - "@e2b/mcp-server"
env_vars:
  - name: E2B_API_KEY
    description: E2B API key used to create and manage sandboxes
    required: true
license: MIT
