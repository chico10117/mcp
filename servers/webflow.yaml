id: webflow
name: Webflow MCP Server
description: >
  Webflow's official MCP server that connects AI tools to your Webflow projects via the
  Webflow Data API. Lets agents manage sites and pages, work with CMS collections and items,
  read form submissions, and publish changes, enabling content updates and site automation
  from an MCP-compatible client.
author:
  name: Webflow
  github: webflow
repository: https://github.com/webflow/mcp-server
transport:
  - stdio
category: Cloud
tags:
  - webflow
  - cms
  - website-builder
  - no-code
  - content-management
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
tools:
  - name: sites_list
    description: List the Webflow sites accessible with the provided token.
    input_schema:
      type: object
      properties: {}
  - name: collections_list
    description: List CMS collections for a Webflow site.
    input_schema:
      type: object
      properties:
        site_id:
          type: string
          description: ID of the Webflow site
      required:
        - site_id
  - name: collection_items_create_item
    description: Create a new item in a CMS collection.
    input_schema:
      type: object
      properties:
        collection_id:
          type: string
          description: ID of the target collection
        fields:
          type: object
          description: Field values for the new item
      required:
        - collection_id
        - fields
install:
  npm: "webflow-mcp-server"
  command: npx
  args:
    - "-y"
    - "webflow-mcp-server"
env_vars:
  - name: WEBFLOW_TOKEN
    description: Webflow API access token
    required: true
