id: launchdarkly
name: LaunchDarkly MCP Server
description: >
  Official LaunchDarkly MCP server for feature management. Lets AI agents create and toggle feature
  flags, manage targeting rules and segments, and inspect flag status across environments. Useful
  for progressive delivery, kill switches, experimentation, and automating flag lifecycle from an
  AI assistant.
author:
  name: LaunchDarkly
  github: launchdarkly
repository: https://github.com/launchdarkly/mcp-server
transport:
  - stdio
category: DevOps
tags:
  - launchdarkly
  - feature-flags
  - progressive-delivery
  - experimentation
  - devops
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
tools:
  - name: list_flags
    description: List feature flags in a project and environment.
    input_schema:
      type: object
      properties:
        project_key:
          type: string
          description: LaunchDarkly project key
      required:
        - project_key
  - name: toggle_flag
    description: Turn a feature flag on or off in a given environment.
    input_schema:
      type: object
      properties:
        flag_key:
          type: string
          description: Feature flag key
        environment:
          type: string
          description: Environment key
        enabled:
          type: boolean
          description: Whether the flag should be on
      required:
        - flag_key
        - environment
        - enabled
install:
  npm: "@launchdarkly/mcp-server"
  command: npx
  args:
    - "-y"
    - "@launchdarkly/mcp-server"
env_vars:
  - name: LAUNCHDARKLY_API_KEY
    description: LaunchDarkly API access token
    required: true
license: Apache-2.0
version: "0.1.0"
stars: 190
