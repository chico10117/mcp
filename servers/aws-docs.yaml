id: aws-docs
name: AWS Documentation MCP Server
description: >
  Provides access to AWS documentation and service information through the Model
  Context Protocol. Enables AI agents to search AWS documentation, retrieve service
  descriptions, look up API references, and find best practices for AWS services.
  Part of the official AWS Labs MCP servers collection with multiple AWS-focused
  servers available.
author:
  name: AWS
  github: awslabs
repository: https://github.com/awslabs/mcp
transport:
  - stdio
category: Cloud
tags:
  - aws
  - cloud
  - documentation
  - infrastructure
  - devops
created_at: "2025-01-15T00:00:00.000Z"
updated_at: "2026-05-17T00:00:00.000Z"
tools:
  - name: search_documentation
    description: Search AWS documentation for information about services, APIs, and best practices.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search query for AWS documentation
        service:
          type: string
          description: Specific AWS service to search within (e.g., s3, lambda, ec2)
        max_results:
          type: integer
          description: Maximum number of results to return (default 5)
      required:
        - query
  - name: get_service_info
    description: Get detailed information about a specific AWS service including its description and key features.
    input_schema:
      type: object
      properties:
        service:
          type: string
          description: AWS service identifier (e.g., s3, lambda, dynamodb)
      required:
        - service
  - name: get_api_reference
    description: Retrieve API reference documentation for a specific AWS service action.
    input_schema:
      type: object
      properties:
        service:
          type: string
          description: AWS service identifier
        action:
          type: string
          description: API action name (e.g., PutObject, CreateFunction)
      required:
        - service
        - action
install:
  npm: "awslabs.aws-documentation-mcp-server@latest"
  command: uvx
  args:
    - "awslabs.aws-documentation-mcp-server@latest"
env_vars: []
license: Apache-2.0
version: "0.4.0"
stars: 9123
