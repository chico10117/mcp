id: terraform
name: Terraform MCP Server
description: >
  Provides AI agents with the ability to manage Terraform infrastructure through
  the Model Context Protocol. Supports plan generation, state inspection, resource
  drift detection, and module discovery. Enables safe infrastructure changes with
  plan review before apply.
author:
  name: HashiCorp
  github: hashicorp
repository: https://github.com/hashicorp/terraform-mcp-server
transport:
  - stdio
category: Cloud
tags:
  - terraform
  - infrastructure
  - iac
  - cloud
  - hashicorp
  - hcl
created_at: "2026-01-15T00:00:00.000Z"
updated_at: "2026-05-20T00:00:00.000Z"
tools:
  - name: terraform_plan
    description: Run terraform plan in a directory and return the execution plan showing what changes will be made.
    input_schema:
      type: object
      properties:
        working_dir:
          type: string
          description: Path to the Terraform configuration directory
        var_file:
          type: string
          description: Path to a variables file
        target:
          type: string
          description: Resource address to target for partial plans
      required:
        - working_dir
  - name: terraform_show
    description: Show the current state or a saved plan in human-readable format.
    input_schema:
      type: object
      properties:
        working_dir:
          type: string
          description: Path to the Terraform configuration directory
        plan_file:
          type: string
          description: Path to a saved plan file (optional, shows state if omitted)
      required:
        - working_dir
  - name: terraform_validate
    description: Validate Terraform configuration files for syntax and consistency errors.
    input_schema:
      type: object
      properties:
        working_dir:
          type: string
          description: Path to the Terraform configuration directory
      required:
        - working_dir
  - name: search_modules
    description: Search the Terraform Registry for modules matching a query.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search query for modules
        provider:
          type: string
          description: Filter by provider (aws, gcp, azure)
      required:
        - query
install:
  command: npx
  args:
    - "-y"
    - "@hashicorp/terraform-mcp-server"
env_vars:
  - name: TF_TOKEN
    description: Terraform Cloud API token (optional, for remote operations)
    required: false
license: MPL-2.0
version: "0.5.0"
stars: 3150
