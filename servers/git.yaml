id: git
name: Git MCP Server
description: >
  Reference MCP server for Git repository operations. Provides tools to read, search,
  and manipulate Git repositories including viewing commit history, diffs, branches,
  file contents at specific revisions, and repository status. Enables AI agents to
  understand code changes and navigate version history without direct filesystem access.
author:
  name: Anthropic
  github: modelcontextprotocol
repository: https://github.com/modelcontextprotocol/servers
transport:
  - stdio
category: Development
tags:
  - git
  - version-control
  - commits
  - diff
  - branches
created_at: "2024-11-25T00:00:00.000Z"
updated_at: "2026-01-27T00:00:00.000Z"
tools:
  - name: git_log
    description: Show commit history for the repository with messages, authors, and dates.
    input_schema:
      type: object
      properties:
        repo_path:
          type: string
          description: Path to the Git repository
        max_count:
          type: integer
          description: Maximum number of commits to return (default 10)
        branch:
          type: string
          description: Branch name (default current branch)
      required:
        - repo_path
  - name: git_diff
    description: Show changes between commits, branches, or working directory.
    input_schema:
      type: object
      properties:
        repo_path:
          type: string
          description: Path to the Git repository
        target:
          type: string
          description: Commit hash, branch name, or range (e.g. HEAD~3..HEAD)
      required:
        - repo_path
  - name: git_status
    description: Show the working tree status including staged, modified, and untracked files.
    input_schema:
      type: object
      properties:
        repo_path:
          type: string
          description: Path to the Git repository
      required:
        - repo_path
  - name: git_show
    description: Show the contents of a file at a specific commit or branch.
    input_schema:
      type: object
      properties:
        repo_path:
          type: string
          description: Path to the Git repository
        revision:
          type: string
          description: Commit hash or branch name
        path:
          type: string
          description: File path within the repository
      required:
        - repo_path
        - path
install:
  command: uvx
  args:
    - "mcp-server-git"
    - "--repository"
    - "."
env_vars: []
license: Apache-2.0
version: "2026.1.26"
stars: 86206
