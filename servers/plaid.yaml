id: plaid
name: Plaid MCP Server
description: >
  Official Plaid MCP server for financial data connectivity. Lets AI agents work with Plaid's APIs
  to retrieve accounts, balances, and transactions, and to build and debug integrations for
  banking, payments, and identity. Useful for fintech development, personal finance tooling, and
  automating account data workflows.
author:
  name: Plaid
  github: plaid
repository: https://github.com/plaid/plaid-mcp-server
transport:
  - stdio
category: Development
tags:
  - plaid
  - fintech
  - banking
  - payments
  - transactions
  - api
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
tools:
  - name: get_accounts
    description: Retrieve accounts and balances for a linked item.
    input_schema:
      type: object
      properties:
        access_token:
          type: string
          description: Plaid item access token
      required:
        - access_token
  - name: get_transactions
    description: Retrieve transactions for a linked item over a date range.
    input_schema:
      type: object
      properties:
        access_token:
          type: string
          description: Plaid item access token
        start_date:
          type: string
          description: Start date (YYYY-MM-DD)
        end_date:
          type: string
          description: End date (YYYY-MM-DD)
      required:
        - access_token
        - start_date
        - end_date
install:
  npm: "@plaid/mcp-server"
  command: npx
  args:
    - "-y"
    - "@plaid/mcp-server"
env_vars:
  - name: PLAID_CLIENT_ID
    description: Plaid client ID
    required: true
  - name: PLAID_SECRET
    description: Plaid secret key
    required: true
  - name: PLAID_ENV
    description: Plaid environment (sandbox, development, production)
    required: false
license: MIT
version: "0.2.0"
stars: 240
