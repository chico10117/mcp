id: discord
name: Discord MCP Server
description: >
  A Model Context Protocol server that enables AI agents to interact with Discord through a bot.
  Agents can send and read messages in channels, list servers and channels, and manage basic
  server interactions while keeping the user in control. Useful for community automation,
  notifications, and conversational workflows on Discord.
author:
  name: v-3
  github: v-3
repository: https://github.com/v-3/discordmcp
transport:
  - stdio
category: Communication
tags:
  - discord
  - chat
  - messaging
  - community
  - notifications
  - bots
created_at: "2026-06-12T00:00:00.000Z"
updated_at: "2026-06-12T00:00:00.000Z"
tools:
  - name: send_message
    description: Send a message to a specified Discord channel.
    input_schema:
      type: object
      properties:
        channel_id:
          type: string
          description: The Discord channel ID to send the message to
        content:
          type: string
          description: The message content to send
      required:
        - channel_id
        - content
  - name: read_messages
    description: Read recent messages from a Discord channel.
    input_schema:
      type: object
      properties:
        channel_id:
          type: string
          description: The Discord channel ID to read from
        limit:
          type: integer
          description: Maximum number of messages to retrieve
      required:
        - channel_id
install:
  npm: "discordmcp"
  command: npx
  args:
    - "-y"
    - "discordmcp"
env_vars:
  - name: DISCORD_TOKEN
    description: Discord bot token used to authenticate the bot
    required: true
license: MIT
