id: databricks
name: Databricks MCP Server
description: >
  MCP server for the Databricks Data Intelligence Platform. Enables AI agents to run SQL against
  the Unity Catalog, inspect schemas and tables, and manage and monitor jobs, bringing lakehouse
  data and workflows into AI-powered development tools.
author:
  name: Databricks
  github: databricks
repository: https://github.com/databrickslabs/mcp
transport:
  - stdio
category: Database
tags:
  - databricks
  - lakehouse
  - sql
  - unity-catalog
  - data-engineering
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
tools:
  - name: run_sql_query
    description: Execute a SQL query against a Databricks SQL warehouse and return the results.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: SQL statement to execute
        warehouse_id:
          type: string
          description: ID of the SQL warehouse to run against
      required:
        - query
  - name: list_jobs
    description: List Databricks jobs and their most recent run status.
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          description: Maximum number of jobs to return
env_vars:
  - name: DATABRICKS_HOST
    description: Databricks workspace URL
    required: true
  - name: DATABRICKS_TOKEN
    description: Personal access token for the workspace
    required: true
license: Apache-2.0
version: "0.4.0"
stars: 588
