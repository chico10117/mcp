id: n8n
name: n8n MCP Server
description: >
  Popular community MCP server that gives AI assistants deep knowledge of n8n's workflow
  automation nodes, their properties, and operations, and can connect to a live n8n instance
  to create and manage workflows. Helps agents design, validate, and deploy automations
  correctly by exposing node documentation, validation, and workflow management tools.
author:
  name: Romuald Czlonkowski
  github: czlonkowski
repository: https://github.com/czlonkowski/n8n-mcp
transport:
  - stdio
  - http-streaming
category: Productivity
tags:
  - n8n
  - workflow-automation
  - automation
  - integrations
  - no-code
  - productivity
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
tools:
  - name: search_nodes
    description: Search n8n nodes by keyword and return their documentation and properties.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search term for node names or functionality
      required:
        - query
  - name: validate_workflow
    description: Validate an n8n workflow JSON for correctness before deployment.
    input_schema:
      type: object
      properties:
        workflow:
          type: object
          description: n8n workflow definition to validate
      required:
        - workflow
  - name: create_workflow
    description: Create a workflow on a connected n8n instance (requires API configuration).
    input_schema:
      type: object
      properties:
        workflow:
          type: object
          description: n8n workflow definition to create
      required:
        - workflow
install:
  npm: "n8n-mcp"
  command: npx
  args:
    - "n8n-mcp"
env_vars:
  - name: N8N_API_URL
    description: Base URL of your n8n instance (enables workflow management tools)
    required: false
  - name: N8N_API_KEY
    description: n8n API key for managing workflows on your instance
    required: false
