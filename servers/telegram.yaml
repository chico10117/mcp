id: telegram
name: Telegram MCP Server
description: >
  MCP server for the Telegram Bot API. Lets AI agents send messages, deliver files and photos,
  and read updates from chats and channels through a bot, enabling notifications and conversational
  workflows from AI-powered tools.
author:
  name: Telegram MCP Community
  github: chigwell
repository: https://github.com/chigwell/telegram-mcp
transport:
  - stdio
category: Communication
tags:
  - telegram
  - messaging
  - notifications
  - bot
  - chat
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
tools:
  - name: send_message
    description: Send a text message to a Telegram chat or channel via the bot.
    input_schema:
      type: object
      properties:
        chat_id:
          type: string
          description: Target chat or channel ID
        text:
          type: string
          description: Message text (supports Markdown)
      required:
        - chat_id
        - text
  - name: send_document
    description: Send a file or document to a Telegram chat.
    input_schema:
      type: object
      properties:
        chat_id:
          type: string
          description: Target chat or channel ID
        file_path:
          type: string
          description: Path to the file to send
      required:
        - chat_id
        - file_path
env_vars:
  - name: TELEGRAM_BOT_TOKEN
    description: Token for the Telegram bot obtained from BotFather
    required: true
license: MIT
version: "0.1.5"
stars: 208
