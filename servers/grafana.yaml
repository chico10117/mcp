id: grafana
name: Grafana MCP Server
description: >
  MCP server for Grafana's observability platform. Enables AI agents to query metrics
  from Prometheus, search and analyze logs from Loki, query traces, list and manage
  dashboards, and investigate incidents. Useful for debugging production issues,
  building monitoring dashboards, and performing root cause analysis with AI assistance
  across the full Grafana LGTM stack.
author:
  name: Grafana Labs
  github: grafana
repository: https://github.com/grafana/mcp-grafana
transport:
  - stdio
  - sse
category: DevOps
tags:
  - monitoring
  - observability
  - prometheus
  - loki
  - dashboards
  - metrics
  - logs
  - alerting
created_at: "2025-03-15T00:00:00.000Z"
updated_at: "2026-05-26T00:00:00.000Z"
tools:
  - name: query_prometheus
    description: Execute a PromQL query against Prometheus datasource.
    input_schema:
      type: object
      properties:
        expr:
          type: string
          description: PromQL expression to evaluate
        start:
          type: string
          description: Start time (ISO 8601 or relative like 'now-1h')
        end:
          type: string
          description: End time (ISO 8601 or 'now')
        step:
          type: string
          description: Query resolution step (e.g., '15s', '1m')
      required:
        - expr
  - name: query_loki
    description: Execute a LogQL query against Loki datasource.
    input_schema:
      type: object
      properties:
        expr:
          type: string
          description: LogQL expression to query logs
        start:
          type: string
          description: Start time for the query range
        end:
          type: string
          description: End time for the query range
        limit:
          type: integer
          description: Maximum number of log lines to return
      required:
        - expr
  - name: list_dashboards
    description: List all Grafana dashboards with optional search filter.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search query to filter dashboards
        tag:
          type: string
          description: Filter by dashboard tag
  - name: list_alerts
    description: List active and pending alert rules.
    input_schema:
      type: object
      properties:
        state:
          type: string
          enum: ["firing", "pending", "inactive"]
          description: Filter alerts by state
install:
  command: go
  args:
    - "run"
    - "github.com/grafana/mcp-grafana@latest"
env_vars:
  - name: GRAFANA_URL
    description: Grafana instance URL (e.g., http://localhost:3000)
    required: true
  - name: GRAFANA_API_KEY
    description: Grafana API key or service account token
    required: true
license: Apache-2.0
version: "0.4.2"
stars: 2100
