id: apple-mcp
name: Apple MCP
description: >
  A collection of Apple-native tools exposed through the Model Context Protocol, letting AI
  assistants work with built-in macOS apps. Provides access to Messages, Notes, Contacts,
  Calendar, Reminders, Mail, and Maps so agents can send messages, create notes and events, and
  look up contacts directly on a Mac.
author:
  name: Dhravya Shah
  github: Dhravya
repository: https://github.com/Dhravya/apple-mcp
transport:
  - stdio
category: Productivity
tags:
  - apple
  - macos
  - notes
  - messages
  - calendar
  - contacts
created_at: "2026-07-25T00:00:00.000Z"
updated_at: "2026-07-25T00:00:00.000Z"
tools:
  - name: send_message
    description: Send an iMessage or SMS to a contact via the Messages app.
    input_schema:
      type: object
      properties:
        recipient:
          type: string
          description: Phone number or contact name
        body:
          type: string
          description: Message text
      required:
        - recipient
        - body
  - name: create_note
    description: Create a note in the Notes app.
    input_schema:
      type: object
      properties:
        title:
          type: string
          description: Note title
        body:
          type: string
          description: Note content
      required:
        - body
  - name: create_event
    description: Create a calendar event.
    input_schema:
      type: object
      properties:
        title:
          type: string
          description: Event title
        start:
          type: string
          description: Start date-time
        end:
          type: string
          description: End date-time
      required:
        - title
        - start
install:
  npm: "@dhravya/apple-mcp"
  command: npx
  args:
    - "-y"
    - "@dhravya/apple-mcp"
license: MIT
