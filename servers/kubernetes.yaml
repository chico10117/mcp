id: kubernetes
name: Kubernetes MCP Server
description: >
  A powerful, native Go implementation of a Kubernetes MCP server with support for
  Kubernetes and OpenShift. Unlike kubectl wrappers, it interacts directly with the
  Kubernetes API server — no external CLI tools required. Distributed as a single
  lightweight binary for Linux, macOS, and Windows. Supports multi-cluster configurations,
  Helm chart management, Tekton pipelines, pod exec, log streaming, and optional
  OpenTelemetry distributed tracing.
author:
  name: Marc Nuri
  github: manusa
repository: https://github.com/manusa/kubernetes-mcp-server
transport:
  - stdio
  - http-streaming
category: DevOps
tags:
  - kubernetes
  - k8s
  - openshift
  - devops
  - containers
  - helm
  - cloud-native
  - infrastructure
created_at: "2026-05-31T00:00:00.000Z"
updated_at: "2026-05-31T00:00:00.000Z"
tools:
  - name: pods_list
    description: >
      List pods in all namespaces or a specific namespace, with optional
      label selector filtering.
    input_schema:
      type: object
      properties:
        namespace:
          type: string
          description: Kubernetes namespace (omit for all namespaces)
        labelSelector:
          type: string
          description: Label selector filter (e.g. "app=nginx")
  - name: pods_logs
    description: >
      Stream or retrieve logs from a pod container. Supports tail lines,
      since time, and container selection for multi-container pods.
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Pod name
        namespace:
          type: string
          description: Kubernetes namespace
        container:
          type: string
          description: Container name (required for multi-container pods)
        tailLines:
          type: integer
          description: Number of lines from the end of the logs to return
      required:
        - name
        - namespace
  - name: pods_exec
    description: >
      Execute a command inside a running pod container and return the output.
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: Pod name
        namespace:
          type: string
          description: Kubernetes namespace
        command:
          type: array
          items:
            type: string
          description: Command and arguments to execute
        container:
          type: string
          description: Container name (for multi-container pods)
      required:
        - name
        - namespace
        - command
  - name: resources_get
    description: >
      Get any Kubernetes or OpenShift resource by kind, name, and namespace.
      Supports all built-in and custom resource types.
    input_schema:
      type: object
      properties:
        kind:
          type: string
          description: Resource kind (e.g. Deployment, Service, ConfigMap)
        name:
          type: string
          description: Resource name
        namespace:
          type: string
          description: Kubernetes namespace
      required:
        - kind
        - name
  - name: resources_apply
    description: >
      Create or update any Kubernetes resource by applying a YAML/JSON manifest.
      Equivalent to kubectl apply.
    input_schema:
      type: object
      properties:
        manifest:
          type: string
          description: YAML or JSON manifest of the resource to apply
      required:
        - manifest
  - name: resources_delete
    description: >
      Delete a Kubernetes resource by kind, name, and namespace.
    input_schema:
      type: object
      properties:
        kind:
          type: string
          description: Resource kind
        name:
          type: string
          description: Resource name
        namespace:
          type: string
          description: Kubernetes namespace
      required:
        - kind
        - name
  - name: helm_install
    description: >
      Install or upgrade a Helm chart in the specified namespace.
    input_schema:
      type: object
      properties:
        releaseName:
          type: string
          description: Helm release name
        chart:
          type: string
          description: Chart reference (e.g. bitnami/nginx or ./my-chart)
        namespace:
          type: string
          description: Target namespace
        values:
          type: object
          description: Chart values to override
      required:
        - releaseName
        - chart
  - name: namespaces_list
    description: List all Kubernetes namespaces in the cluster.
    input_schema:
      type: object
      properties: {}
install:
  npm: "kubernetes-mcp-server"
  command: npx
  args:
    - "-y"
    - "kubernetes-mcp-server@latest"
license: Apache-2.0
version: "0.4.0"
stars: 1800
