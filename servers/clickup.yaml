id: clickup
name: ClickUp MCP Server
description: >
  MCP server for the ClickUp project management platform. Enables AI agents to create and update
  tasks, browse spaces, folders, and lists, and manage task status and assignees, bringing
  ClickUp work management into AI-powered tools.
author:
  name: ClickUp Community
  github: taazkareem
repository: https://github.com/taazkareem/clickup-mcp-server
transport:
  - stdio
category: Productivity
tags:
  - clickup
  - project-management
  - tasks
  - productivity
  - task-tracking
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
tools:
  - name: create_task
    description: Create a task in a ClickUp list with name, description, assignees, and status.
    input_schema:
      type: object
      properties:
        list_id:
          type: string
          description: ID of the list to create the task in
        name:
          type: string
          description: Task name
        description:
          type: string
          description: Task description in Markdown
        assignees:
          type: array
          items:
            type: string
          description: User IDs to assign
      required:
        - list_id
        - name
  - name: search_tasks
    description: Search tasks across a ClickUp workspace by query, status, or assignee.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Text to search for
        status:
          type: string
          description: Filter by task status
      required:
        - query
install:
  npm: "@taazkareem/clickup-mcp-server"
  command: npx
  args:
    - "-y"
    - "@taazkareem/clickup-mcp-server"
env_vars:
  - name: CLICKUP_API_TOKEN
    description: ClickUp personal API token
    required: true
  - name: CLICKUP_TEAM_ID
    description: ClickUp workspace (team) ID
    required: true
license: MIT
version: "0.8.0"
stars: 645
