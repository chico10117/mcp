id: exa
name: Exa MCP Server
description: >
  MCP server for Exa's neural search API. Provides AI agents with powerful web search
  capabilities using embeddings-based semantic search. Returns clean, parsed content from
  web pages with relevance scoring. Supports filtering by domain, date range, and content
  type for precise information retrieval from the internet.
author:
  name: Exa
  github: exa-labs
repository: https://github.com/exa-labs/exa-mcp-server
transport:
  - stdio
category: Research
tags:
  - search
  - web-search
  - semantic-search
  - research
  - information-retrieval
created_at: "2025-01-15T00:00:00.000Z"
updated_at: "2026-05-25T00:00:00.000Z"
tools:
  - name: search
    description: Perform a neural search query and return relevant web results with content.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Natural language search query
        numResults:
          type: integer
          description: Number of results to return (default 10)
        includeDomains:
          type: array
          items:
            type: string
          description: Only include results from these domains
        excludeDomains:
          type: array
          items:
            type: string
          description: Exclude results from these domains
        startPublishedDate:
          type: string
          description: Filter results published after this date (ISO 8601)
        category:
          type: string
          description: Content category filter (news, blog, academic, etc.)
      required:
        - query
  - name: find_similar
    description: Find web pages similar to a given URL using semantic similarity.
    input_schema:
      type: object
      properties:
        url:
          type: string
          description: URL to find similar pages for
        numResults:
          type: integer
          description: Number of similar results to return
      required:
        - url
  - name: get_contents
    description: Get the full parsed content of specific URLs.
    input_schema:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
          description: URLs to fetch and parse content from
      required:
        - urls
install:
  npm: "exa-mcp-server"
  command: npx
  args:
    - "-y"
    - "exa-mcp-server"
env_vars:
  - name: EXA_API_KEY
    description: Exa API key for authentication
    required: true
license: MIT
version: "1.2.0"
stars: 5600
