id: shopify
name: Shopify Dev MCP Server
description: >
  The official Shopify Dev MCP server, built by Shopify, gives AI coding tools direct access to
  Shopify's developer platform. Agents can search Shopify documentation, explore and introspect
  the Admin and Storefront GraphQL API schemas, validate GraphQL operations, and scaffold
  Functions — keeping answers grounded in up-to-date, accurate Shopify APIs.
author:
  name: Shopify
  github: Shopify
repository: https://github.com/Shopify/dev-mcp
transport:
  - stdio
category: Development
tags:
  - shopify
  - ecommerce
  - graphql
  - api
  - documentation
  - storefront
created_at: "2026-06-12T00:00:00.000Z"
updated_at: "2026-06-12T00:00:00.000Z"
tools:
  - name: search_dev_docs
    description: Search Shopify developer documentation for relevant guides and references.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Search query for Shopify dev documentation
      required:
        - query
  - name: introspect_admin_schema
    description: Introspect the Shopify Admin GraphQL API schema for types, queries, and mutations.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Term or type name to look up in the Admin GraphQL schema
      required:
        - query
install:
  npm: "@shopify/dev-mcp"
  command: npx
  args:
    - "-y"
    - "@shopify/dev-mcp@latest"
license: MIT
